<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISTILE Annuaire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ISTILE Annuaire</h1>
    <nav>
      <a href="#recherche">Recherche</a>
      <a href="#etudiants">Étudiants</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="recherche">
      <h2>Recherche</h2>
      <form>
        <label for="champ-recherche">Nom, prénom ou filière</label>
        <input type="search" id="champ-recherche" name="q" placeholder="Ex. Ngo, Aïcha, Réseaux" autocomplete="off">
        <button type="submit">Rechercher</button>
      </form>
    </section>

    <section id="etudiants">
      <h2>Étudiants</h2>
      <p id="resultat-recherche" role="status" aria-live="polite"></p>
      <div class="grille" id="liste-etudiants"></div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Secrétariat académique : <a href="mailto:secretariat@istile.cm">secretariat@istile.cm</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ISTILE : Mini-TP Modules 1 et 2</p>
  </footer>
  <script type="module" src="src/recherche.js"></script>
</body>
</html>
